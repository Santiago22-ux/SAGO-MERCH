<!DOCTYPE html>
<html lang="es">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAGO MERCH | Elite Headwear</title>
    
    <link rel="icon" type="image/png" href="Gemini_Generated_Image_9mgzxp9mgzxp9mgz.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Inter:wght@300;400;900&display=swap" rel="stylesheet">
    <style>
        /* Tu CSS actual... */
    </style>

    <style>
        :root {
            --bg: #000000;
            --accent: #ffffff;
            --gray: #111111;
            --wa-green: #25d366;
            --transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: var(--accent); font-family: 'Inter', sans-serif; overflow-x: hidden; }

        /* --- CONTENEDOR DE PÁGINAS --- */
        .page {
            display: none; 
            min-height: 100vh;
            width: 100%;
            animation: fadeIn 0.6s ease;
        }

        .page.active {
            display: flex; 
            flex-direction: column;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- SECCIÓN INICIO --- */
        #inicio {
            align-items: center;
            justify-content: center;
            text-align: center;
            background: radial-gradient(circle, #151515 0%, #000 100%);
        }

        .logo-main { width: 220px; height: auto; margin-bottom: 20px; }
        .hero-title { font-family: 'Syncopate', sans-serif; font-size: clamp(2.5rem, 10vw, 5rem); line-height: 0.9; margin-bottom: 25px; }
        .location { font-size: 0.7rem; letter-spacing: 6px; color: #555; margin-bottom: 40px; }

        .btn-explorer {
            padding: 20px 50px;
            background: #fff;
            color: #000;
            border: none;
            font-weight: 900;
            letter-spacing: 2px;
            cursor: pointer;
            transition: var(--transition);
        }
        .btn-explorer:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(255,255,255,0.2); }

        /* --- SECCIÓN CATÁLOGO --- */
        #catalogo { padding: 40px 5%; }

        .nav-catalogo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--gray);
            margin-bottom: 40px;
        }

        .btn-back {
            background: transparent;
            color: #555;
            border: 1px solid #333;
            padding: 8px 20px;
            cursor: pointer;
            font-weight: 800;
            font-size: 0.7rem;
            transition: 0.3s;
        }
        .btn-back:hover { color: #fff; border-color: #fff; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: #080808;
            padding: 20px;
            border: 1px solid #151515;
            text-align: center;
            transition: 0.4s;
        }
        .card:hover { border-color: #444; }
        .card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; margin-bottom: 20px; transition: 0.5s; border-radius: 4px; }
        .card:hover img { transform: scale(1.03); }

        .card h3 { font-family: 'Syncopate', sans-serif; font-size: 0.9rem; margin-bottom: 10px; }
        .price { display: block; color: #666; font-weight: 900; margin-bottom: 20px; }

        .btn-buy {
            width: 100%;
            padding: 15px;
            background: #fff;
            color: #000;
            border: none;
            font-weight: 900;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-buy:hover { background: #000; color: #fff; outline: 1px solid #fff; }

        /* --- MODAL --- */
        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.98);
            display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px;
        }
        .modal.active { display: flex; }
        .modal-box { width: 100%; max-width: 400px; text-align: center; }
        
        input {
            width: 100%; background: transparent; border: none; border-bottom: 2px solid #222;
            padding: 15px; color: #fff; margin-bottom: 20px; outline: none; font-size: 1rem;
        }
        input:focus { border-color: #fff; }

        .btn-wa { background: var(--wa-green); color: #000; width: 100%; padding: 18px; border: none; font-weight: 900; cursor: pointer; }

        footer { text-align: center; padding: 60px; color: #222; font-size: 0.6rem; letter-spacing: 3px; }
    </style>
</head>
<body>

    <section id="inicio" class="page active">
         <div class="location">NARIÑO • COLOMBIA</div>
        <h1 class="hero-title">SAGO<br>MERCH</h1>
        <button class="btn-explorer" onclick="navegar('catalogo')">EXPLORAR DROP</button>
    </section>

    <section id="catalogo" class="page">
        <div class="nav-catalogo">
            <div style="font-family: 'Syncopate'; font-size: 0.8rem;">SAGO / CATALOGO</div>
            <button class="btn-back" onclick="navegar('inicio')">← VOLVER AL INICIO</button>
        </div>

        <div class="grid">
            <div class="card">
                <img src="WhatsApp Image 2026-05-11 at 3.53.57 PM.jpeg" alt="Midnight Blue">
                <h3>Midnight Blue</h3>
                <span class="price">$55.000 COP</span>
                <button class="btn-buy" onclick="openOrder('Midnight Blue')">COMPRAR</button>
            </div>

            <div class="card">
                <img src="SAGO MERCH 3.3.png" alt="Black Viper">
                <h3>Black Viper</h3>
                <span class="price">$55.000 COP</span>
                <button class="btn-buy" onclick="openOrder('Black Viper')">COMPRAR</button>
            </div>

            <div class="card">
                <img src="SAGO MERCH 2.2.jpeg" alt="Shadow Heritage">
                <h3>Shadow Heritage</h3>
                <span class="price">$65.000 COP</span>
                <button class="btn-buy" onclick="openOrder('Shadow Heritage')">COMPRAR</button>
            </div>
        </div>

        <footer>SAGO MERCH © 2026 • ESTILO SIN LÍMITES</footer>
    </section>

    <div id="modal" class="modal">
        <div class="modal-box">
            <h2 id="product-name" style="margin-bottom: 30px; font-family: 'Syncopate'; font-size: 1.2rem;"></h2>
            <input type="text" id="user-name" placeholder="¿CUÁL ES TU NOMBRE?">
            <input type="text" id="user-city" placeholder="MUNICIPIO / CIUDAD">
            <button class="btn-wa" onclick="sendToWhatsApp()">PEDIR POR WHATSAPP</button>
            <p onclick="closeModal()" style="margin-top: 30px; color: #444; cursor: pointer; font-size: 0.7rem; font-weight: 800;">CANCELAR</p>
        </div>
    </div>

    <script>
        const MY_PHONE = "573108390933";
        let itemSelected = "";

        function navegar(idSeccion) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(idSeccion).classList.add('active');
            window.scrollTo(0, 0);
        }

        function openOrder(name) {
            itemSelected = name;
            document.getElementById('product-name').innerText = name;
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        function sendToWhatsApp() {
            const n = document.getElementById('user-name').value;
            const c = document.getElementById('user-city').value;
            if(!n || !c) return alert("Por favor rellena tus datos.");
            const msg = `¡Hola SAGO MERCH! 🧢 Quiero adquiri:* ${itemSelected}*%0A*Nombre:* ${n}%0A*Ciudad:* ${c}`;
            window.open(`https://wa.me/${MY_PHONE}?text=${msg}`, '_blank');
        }
    </script>
</body>
</html>
